name: Release

# Push a tag like v1.2.3 to build the desktop app for Windows, macOS and Linux
# and publish it with checksums. The installers download these files.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (for re-runs)"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Desktop app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --no-bundle
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - name: macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm tauri build ${{ matrix.args }} -- --locked
      - name: Collect
        run: |
          mkdir -p ../out
          case "${{ matrix.name }}" in
            windows-x64)
              cp src-tauri/target/release/signal-scribe.exe ../out/signal-scribe-windows-x64.exe ;;
            macos-universal)
              tar -C src-tauri/target/universal-apple-darwin/release/bundle/macos -czf \
                ../out/signal-scribe-macos-universal.app.tar.gz "Signal Scribe.app" ;;
            linux-x64)
              cp src-tauri/target/release/bundle/appimage/*.AppImage ../out/signal-scribe-linux-x64.AppImage ;;
          esac
          ls -la ../out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \[?"v"\]?" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          Download the source code below (or `git clone`), then run `install.ps1` (Windows) or
          `install.sh` (macOS/Linux). The installer fetches the matching desktop app from this
          release and checks it against `SHA256SUMS.txt`. See the README for details.
          NOTES
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "Signal Scribe ${TAG#v}" --notes-file notes.md --verify-tag
          fi

  verify:
    name: Install the published app (${{ matrix.os }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Install with the desktop app from this release (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\install.ps1 -Model none -NoAutostart -NoShortcuts -NoLaunch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path runtime\desktop\signal-scribe.exe)) { throw "desktop app missing" }
      - name: Install with the desktop app from this release (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          ./install.sh --model none --no-autostart --no-shortcuts --no-launch
          if [ "$RUNNER_OS" = "macOS" ]; then
            test -x "$HOME/Applications/Signal Scribe.app/Contents/MacOS/signal-scribe"
          else
            test -x runtime/desktop/app/AppRun
          fi
