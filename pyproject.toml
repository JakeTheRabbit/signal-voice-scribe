[project]
name = "signal-scribe"
version = "1.0.1"
description = "Read your Signal voice notes instead of listening to them. Private, on-device transcription."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper>=1.2,<2",
    "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
# NVIDIA GPU acceleration for Whisper (Windows and Linux). CTranslate2 loads
# these CUDA 12 libraries by name; the engine points it at them at startup.
cuda = [
    "nvidia-cublas-cu12>=12.4,<13; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]

[project.scripts]
signal-scribe = "scribe.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
